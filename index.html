<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>騎乘代練計算器 | AdamLight(178647)</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 15px; background-color: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h3 { margin-top: 0; color: #333; font-size: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: bold; color: #212529; }

        input[type="number"] { 
            width: 150px; padding: 12px; border: 2px solid #007bff; border-radius: 8px; 
            font-size: 18px; text-align: center; font-weight: bold; -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* 當前等級提示文字 */
        .lv-status { font-size: 14px; color: #007bff; margin-top: 8px; font-weight: bold; height: 20px; }

        .target-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 25px; margin-top: 15px; }
        .target-btn { 
            flex: 1; padding: 12px 0; background: #fff; border: 2px solid #ddd; border-radius: 8px;
            cursor: pointer; font-weight: bold; color: #555; transition: all 0.2s;
        }
        .target-btn.active { background: #007bff; border-color: #007bff; color: white; box-shadow: 0 2px 8px rgba(0,123,255,0.3); }
        .target-btn small { display: block; font-size: 10px; font-weight: normal; margin-top: 2px; }

        .result-box { background: #fff9db; border: 1px dashed #fab005; padding: 20px; border-radius: 8px; }
        .price-label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .price { font-size: 32px; color: #e44d26; font-weight: bold; }
        .rem-detail { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>騎乘代練價格試算 | AdamLight(178647)</h3>
    
    <div class="input-group">
        <label>1. 輸入目前總經驗值：</label>
        <input type="number" id="currentExp" placeholder="0" value="0">
        <div id="currentLvHint" class="lv-status">判定等級：騎乘 LV1</div>
    </div>

    <label style="margin-top: 25px;">2. 選擇目標等級：</label>
    <div class="target-container" id="targetGroup">
        <div class="target-btn" data-exp="2475">目標 LV4<small>2475 經驗</small></div>
        <div class="target-btn" data-exp="22950">目標 LV8<small>22950 經驗</small></div>
        <div class="target-btn active" data-exp="40275">目標 LV10<small>40275 經驗</small></div>
    </div>

    <div class="result-box">
        <div class="price-label">應付金額</div>
        <div><span class="price" id="totalPrice">120</span> <small>楓幣</small></div>
        <div class="rem-detail">尚缺經驗：<span id="remExp">40,275</span></div>
    </div>
</div>

<script>
    const TOTAL_MAX_EXP = 40275;
    const TOTAL_MAX_PRICE = 120;
    
    // 等級經驗門檻數據
    const lvThresholds = [
        {lv: 10, exp: 40275}, {lv: 9, exp: 30825}, {lv: 8, exp: 22950},
        {lv: 7, exp: 16650}, {lv: 6, exp: 10350}, {lv: 5, exp: 5625},
        {lv: 4, exp: 2475}, {lv: 3, exp: 900}, {lv: 2, exp: 225}, {lv: 1, exp: 0}
    ];

    let currentTargetExp = 40275;

    const input = document.getElementById('currentExp');
    const btns = document.querySelectorAll('.target-btn');
    const lvHint = document.getElementById('currentLvHint');

    btns.forEach(btn => {
        btn.addEventListener('click', function() {
            btns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentTargetExp = parseInt(this.getAttribute('data-exp'));
            calculate();
        });
    });

    input.addEventListener('input', calculate);

    function calculate() {
        const current = parseInt(input.value) || 0;
        
        // 1. 判定目前等級
        let detectedLv = 1;
        for (let threshold of lvThresholds) {
            if (current >= threshold.exp) {
                detectedLv = threshold.lv;
                break;
            }
        }
        lvHint.innerText = `判定等級：騎乘 LV${detectedLv}`;

        // 2. 計算剩餘經驗與價格
        let remaining = currentTargetExp - current;
        if (remaining < 0) remaining = 0;

        const price = (remaining / TOTAL_MAX_EXP) * TOTAL_MAX_PRICE;

        document.getElementById('remExp').innerText = remaining.toLocaleString();
        document.getElementById('totalPrice').innerText = Math.ceil(price);
    }
</script>

</body>
</html>
